# One of two independent reviewers (the other is CodeRabbit, .coderabbit.yaml).
# Both review a PR once, when it opens; comment `/gemini review` for another
# pass after later pushes. Advisory, never a required check.
have_fun: false
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: false
    code_review: true
    include_drafts: false
ignore_patterns:
  - "immich_accelerator/selftest/*.heic"
  - "immich_accelerator/selftest/*.jpg"
  - "immich_accelerator/selftest/*.mp4"
