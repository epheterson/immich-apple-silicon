# One of two independent reviewers on every push (the other is CodeRabbit,
# .coderabbit.yaml). Gemini reviews a PR when it opens; gemini-review.yml asks
# it again after each push. Advisory, never a required check.
have_fun: false
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: false
    code_review: true
    include_drafts: false
ignore_patterns:
  - "immich_accelerator/selftest/*.heic"
  - "immich_accelerator/selftest/*.jpg"
  - "immich_accelerator/selftest/*.mp4"
