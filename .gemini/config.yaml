# Gemini Code Assist: the automatic reviewer on every PR. Advisory, not a
# required check. CodeRabbit (.coderabbit.yaml) is the on-demand fallback.
have_fun: false
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: false
    code_review: true
    include_drafts: false
ignore_patterns:
  - "immich_accelerator/selftest/*.heic"
  - "immich_accelerator/selftest/*.jpg"
  - "immich_accelerator/selftest/*.mp4"
