name: Update Homebrew Formula

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.3.6)'
        required: true

jobs:
  build-native:
    # Build the native ML bundle on macOS (Swift + Metal) and attach it to the
    # release, so the formula can install a prebuilt, ad-hoc-signed binary (no
    # notarization; brew does not quarantine its downloads). macos-15 = Swift 6,
    # so mlx-swift resolves to the validated 0.31.x.
    runs-on: macos-15
    outputs:
      sha256: ${{ steps.pkg.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - name: onnxruntime
        run: brew install onnxruntime
      - name: metallib matching mlx-swift
        run: |
          pip3 install --break-system-packages "mlx==0.31.1" || pip3 install "mlx==0.31.1"
          MLX_DIR="$(python3 -c 'import mlx; print(list(mlx.__path__)[0])')"
          MLX_METALLIB="$(find "$MLX_DIR" -name mlx.metallib 2>/dev/null | head -1)"
          [ -n "$MLX_METALLIB" ] || MLX_METALLIB="$(find /opt/homebrew -name mlx.metallib 2>/dev/null | head -1)"
          test -f "$MLX_METALLIB" || { echo "no mlx.metallib found"; exit 1; }
          echo "MLX_METALLIB=$MLX_METALLIB" >> "$GITHUB_ENV"
      - name: Build + upload native bundle asset
        id: pkg
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          cd native-ml && bash scripts/release_bundle.sh "$VERSION"
          TARBALL="$(ls immich-ml-native-*.tar.gz)"
          echo "sha256=$(shasum -a 256 "$TARBALL" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          gh release upload "$TAG" "$TARBALL" --clobber

  update-tap:
    needs: build-native
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Get version from tag
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Get source tarball sha256
        id: sha
        run: |
          SHA=$(curl -sL "https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz" | sha256sum | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Get ML submodule info
        id: ml
        run: |
          ML_COMMIT=$(curl -sL "https://api.github.com/repos/${{ github.repository }}/contents/ml?ref=${TAG}" \
            -H "Accept: application/vnd.github.v3+json" | jq -r '.sha')
          ML_SHA=$(curl -sL "https://github.com/${{ github.repository_owner }}/immich-ml-metal/archive/${ML_COMMIT}.tar.gz" | sha256sum | cut -d' ' -f1)
          echo "commit=$ML_COMMIT" >> "$GITHUB_OUTPUT"
          echo "sha256=$ML_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout accelerator (for the formula renderer)
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          path: acc

      - name: Checkout tap repo
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/homebrew-immich-accelerator
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Render formula
        env:
          OUT: tap/Formula/immich-accelerator.rb
          VERSION: ${{ steps.version.outputs.version }}
          SRC_SHA: ${{ steps.sha.outputs.sha256 }}
          ML_COMMIT: ${{ steps.ml.outputs.commit }}
          ML_SHA: ${{ steps.ml.outputs.sha256 }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          NATIVE_SHA: ${{ needs.build-native.outputs.sha256 }}
        run: |
          export SRC_URL="https://github.com/${REPO}/archive/refs/tags/v${VERSION}.tar.gz"
          export ML_URL="https://github.com/${OWNER}/immich-ml-metal/archive/${ML_COMMIT}.tar.gz"
          export NATIVE_URL="https://github.com/${REPO}/releases/download/${TAG}/immich-ml-native-${VERSION}-macos-arm64.tar.gz"
          # CLIP model is version-independent, hosted once under a stable tag.
          export CLIP_MODEL_URL="https://github.com/${REPO}/releases/download/clip-model-v1/clip-vit-base-patch32.tar.gz"
          bash acc/scripts/render-formula.sh
          ruby -c "$OUT"

      - name: Push updated formula
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/immich-accelerator.rb
          git commit -m "Update formula to v${TAG#v}"
          git push
