name: Upstream sync check

# Notify (never auto-merge) when the bundled immich-ml-metal fork has drifted
# behind upstream. ML changes alter inference behavior (CLIP backend, CoreML
# providers) and must be validated live on Apple Silicon before shipping, so this
# only opens/updates a tracking issue — the pull + validation stays a human step.
#
# Process when this fires (see the issue body):
#   1. Branch `sync-upstream` off upstream main, cherry-pick our standing patches.
#   2. Validate on a Mac (ml-test + a real OCR/face/CLIP round-trip).
#   3. Merge to fork main, bump the `ml` submodule, release.
#
# Standing patches we always carry forward (must survive every sync):
#   - mlx>=0.22.0,<0.31.2  (0.31.1 is the last known-good; both 0.31.2 and 0.32.0
#     hard-crash CLIP inference, #38 / #103). Re-test any lift with the real-model
#     gate scripts/ml-preflight.py, never a proxy/STUB_MODE test.

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: read
  issues: write

env:
  UPSTREAM: sebastianfredette/immich-ml-metal
  TRACKING_TITLE: "ML upstream sync: immich-ml-metal has new commits"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Compare our ml pin against upstream main
        id: cmp
        run: |
          set -euo pipefail
          cd ml
          OUR_SHA="$(git rev-parse HEAD)"
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch --quiet upstream main
          UP_SHA="$(git rev-parse upstream/main)"

          # Authoritative check: is upstream/main already contained in our pin?
          # (Do NOT use the GitHub compare API across forks with a merge-commit
          # base — it reports phantom "behind_by" counts. git is the source of
          # truth here.)
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "behind=0" >> "$GITHUB_OUTPUT"
            echo "✅ In sync. our=$OUR_SHA upstream=$UP_SHA"
            exit 0
          fi

          COUNT="$(git rev-list --count HEAD..upstream/main)"
          echo "behind=$COUNT" >> "$GITHUB_OUTPUT"
          echo "our_sha=$OUR_SHA" >> "$GITHUB_OUTPUT"
          echo "up_sha=$UP_SHA" >> "$GITHUB_OUTPUT"

          # Write the (untrusted) upstream commit messages to a FILE rather than
          # GITHUB_OUTPUT: a crafted commit message containing the heredoc
          # delimiter could otherwise break out and inject step outputs.
          git log --oneline --no-decorate HEAD..upstream/main | head -50 \
            > "$GITHUB_WORKSPACE/ml_behind.txt"

          echo "⚠️  Behind by $COUNT commit(s)."

      - name: Open or update tracking issue
        if: steps.cmp.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BEHIND: ${{ steps.cmp.outputs.behind }}
          OUR_SHA: ${{ steps.cmp.outputs.our_sha }}
          UP_SHA: ${{ steps.cmp.outputs.up_sha }}
        run: |
          set -euo pipefail
          # Read untrusted upstream commit log from the file into a shell var.
          # Bash does not re-evaluate the *value* of an expanded variable, so
          # embedding "$LOG" in the heredoc below is not a command-injection
          # vector (single-pass expansion).
          LOG="$(cat "$GITHUB_WORKSPACE/ml_behind.txt")"

          BODY="$(cat <<EOF
          The bundled \`immich-ml-metal\` submodule is **$BEHIND commit(s) behind** upstream \`${UPSTREAM}\` main.

          - our pin: \`$OUR_SHA\`
          - upstream main: \`$UP_SHA\`

          ### New upstream commits
          \`\`\`
          $LOG
          \`\`\`

          ### How to sync (human-validated; do not auto-merge)
          1. In the \`ml\` fork: branch \`sync-upstream\` off upstream \`main\`, cherry-pick our standing patches.
          2. **Validate on a Mac** — \`immich-accelerator ml-test\` plus a real OCR / face / CLIP round-trip.
          3. Merge to fork \`main\`, bump the \`ml\` submodule here, cut a release.

          Standing patches to carry forward every sync:
          - \`mlx>=0.22.0,<0.31.2\` (#38, #103; CLIP threading crash, 0.31.2 and 0.32.0 both bad)

          _Opened automatically by the weekly upstream-sync check; updates in place until synced._
          EOF
          )"

          EXISTING="$(gh issue list --state open --search "in:title \"$TRACKING_TITLE\"" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
            gh issue comment "$EXISTING" --body "Still behind by $BEHIND as of this run (upstream \`$UP_SHA\`)."
            echo "Updated issue #$EXISTING"
          else
            gh issue create --title "$TRACKING_TITLE" --body "$BODY"
            echo "Created tracking issue"
          fi

  mlx-pin:
    # Notify when an mlx newer than the latest KNOWN-BAD (0.32.0) ships, so we
    # re-test before allowing it. Both 0.31.2 (gpu stream) and 0.32.0 (cpu stream)
    # hard-crash real CLIP inference in the worker thread pool with "There is no
    # Stream(...)" (#38, #103). The pin is `mlx>=0.22.0,<0.31.2` (0.31.1, the last
    # known-good). A re-test MUST run the real /predict service via
    # scripts/ml-preflight.py, not a proxy: both bad versions pass image_encoder
    # and STUB_MODE tests yet crash the real service (that is what shipped the
    # v1.5.29 regression).
    runs-on: ubuntu-latest
    env:
      LATEST_BAD: "0.32.0" # newest mlx known to crash; nag when something newer ships
      MLX_TITLE: "mlx > 0.32.0 is available, re-test the CLIP pin (#38, #103)"
    steps:
      - name: Check PyPI for mlx newer than the latest known-bad
        id: mlx
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check packaging
          # Python fetches PyPI itself (urllib); don't pipe curl into `python3 -`
          # with a heredoc, the pipe and the heredoc both claim stdin.
          NEWER="$(LATEST_BAD="$LATEST_BAD" python3 <<'PY'
          import json, os, time, urllib.request
          from packaging.version import Version
          latest_bad = Version(os.environ["LATEST_BAD"])
          # PyPI occasionally resets the TLS handshake from CI runners; retry so a
          # transient blip doesn't fail the weekly check.
          for attempt in range(4):
              try:
                  with urllib.request.urlopen("https://pypi.org/pypi/mlx/json", timeout=30) as r:
                      data = json.load(r)
                  break
              except Exception:
                  if attempt == 3:
                      raise
                  time.sleep(5 * (attempt + 1))
          newer = []
          for ver, files in data["releases"].items():
              if not files or all(f.get("yanked") for f in files):
                  continue  # skip versions with no/only-yanked artifacts
              try:
                  v = Version(ver)
              except Exception:
                  continue
              if v > latest_bad and not v.is_prerelease:
                  newer.append(v)
          newer.sort()
          print(newer[-1] if newer else "")
          PY
          )"
          echo "newer=$NEWER" >> "$GITHUB_OUTPUT"
          if [ -n "$NEWER" ]; then
            echo "⚠️  mlx $NEWER is available (> $LATEST_BAD); pin re-test warranted."
          else
            echo "✅ No mlx > $LATEST_BAD yet. Pin stands."
          fi

      - name: Open or update pin re-test issue
        if: steps.mlx.outputs.newer != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEWER: ${{ steps.mlx.outputs.newer }}
        run: |
          set -euo pipefail
          BODY="$(cat <<EOF
          A newer mlx than the latest known-bad is on PyPI: **$NEWER** (we pin \`mlx>=0.22.0,<0.31.2\`, i.e. 0.31.1; #38, #103).

          Both \`mlx==0.31.2\` (\`Stream(gpu, 0)\`) and \`mlx==0.32.0\` (\`Stream(cpu, 1)\`) hard-crash real CLIP inference in the worker thread pool. **Do NOT lift the pin on a proxy test** — a \`STUB_MODE\` test or a bare \`mlx_clip.image_encoder\` loop passes on both bad versions; only the real service crashes (this is what shipped the v1.5.29 regression, #103).

          Re-test **$NEWER** with the real-model gate on Apple Silicon:

          1. Build a full ml venv (fork \`requirements.txt\`) with \`mlx==$NEWER\` \`mlx-metal==$NEWER\`.
          2. \`python3 scripts/ml-preflight.py --python <venv>/bin/python3 --src <immich-ml-metal checkout>\` — it boots the real service (\`STUB_MODE=false\`) and hammers \`/predict\` with concurrent CLIP inference.
          3. **Pass = exit 0, service alive, no \`Stream(...)\` abort.** Only then bump the pin in the ml fork \`requirements.txt\` and re-sync the submodule.

          _Opened automatically by the weekly mlx-pin check; updates in place until resolved._
          EOF
          )"

          EXISTING="$(gh issue list --state open --search "in:title \"$MLX_TITLE\"" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
            echo "Updated issue #$EXISTING"
          else
            gh issue create --title "$MLX_TITLE" --body "$BODY"
            echo "Created pin re-test issue"
          fi
