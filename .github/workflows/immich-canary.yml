name: Immich canary

# Runs the accelerator's self-test against Immich's latest release on a real
# Apple Silicon runner: Immich's own thumbnail code decodes an HEVC HEIC, and
# every shim must still reach the module it patches. Upstream changing how
# Immich loads its code (3.3 moving to ESM, #191) then opens an issue here the
# day it ships, before users find it. Also runs on PRs that touch the shims,
# so our side can't break them either.

on:
  schedule:
    - cron: "23 */6 * * *" # every six hours
  workflow_dispatch:
    inputs:
      version:
        description: "Immich version to test (default: latest release)"
        required: false
  pull_request:
    paths:
      - "immich_accelerator/hooks/**"
      - "immich_accelerator/__main__.py"
      - ".github/workflows/immich-canary.yml"

permissions:
  contents: read

jobs:
  selftest:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write # open or update the tracking issue on a scheduled failure
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Pick the Immich version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          v="${INPUT_VERSION:-}"
          if [ -z "$v" ]; then
            v="$(gh api repos/immich-app/immich/releases/latest --jq .tag_name)"
          fi
          if [ -z "$v" ]; then echo "::error::could not determine the Immich version"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Testing Immich $v"

      - name: Install the runtime the worker uses
        run: brew install node@22 vips

      - name: Self-test
        id: selftest
        env:
          HOME: ${{ runner.temp }}/home
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -o pipefail
          mkdir -p "$HOME"
          python3 -m immich_accelerator selftest --immich-version "$VERSION" 2>&1 | tee "$RUNNER_TEMP/selftest.log"

      - name: Open or update the tracking issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Immich ${VERSION} fails the accelerator self-test"
          log="$(tail -n 40 "$RUNNER_TEMP/selftest.log" 2>/dev/null || echo 'no log')"
          body="$(printf 'The scheduled canary ran the self-test against Immich %s and it failed.\n\n~~~~\n%s\n~~~~\n\nRun: %s\n' "$VERSION" "$log" "$RUN_URL")"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
