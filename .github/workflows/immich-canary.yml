name: Immich canary

# Runs the accelerator's self-test against Immich's latest release on a real
# Apple Silicon runner: Immich's own code makes image and video thumbnails,
# reads metadata, transcodes HDR video through the ffmpeg wrapper, and runs a
# backup through the pg_dump shim, on tiny fixtures (ML needs a running engine
# and is checked on users' machines instead). Upstream changing how
# Immich loads its code (3.3 moving to ESM, #191) then opens an issue here the
# day it ships, before users find it.
#
# It only runs when something changed: every hour a few-second check asks
# whether this pair (Immich's latest release, our main) has been tested yet,
# and the Mac job runs only for a new pair. PRs that touch the shims, the
# self-test or the ffmpeg wrapper always run it.

on:
  schedule:
    - cron: "23 * * * *" # a few seconds every hour; the Mac job only when something changed
  workflow_dispatch:
    inputs:
      version:
        description: "Immich version to test (default: latest release)"
        required: false
  pull_request:
    paths:
      - "immich_accelerator/hooks/**"
      - "immich_accelerator/selftest/**"
      - "immich_accelerator/ffmpeg-wrapper.sh"
      - "immich_accelerator/__main__.py"
      - ".github/workflows/immich-canary.yml"

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      key: ${{ steps.ver.outputs.key }}
      run: ${{ github.event_name != 'schedule' || steps.seen.outputs.cache-hit != 'true' }}
    steps:
      - name: Pick the Immich version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          v="${INPUT_VERSION:-}"
          if [ -z "$v" ]; then
            v="$(gh api repos/immich-app/immich/releases/latest --jq .tag_name)"
          fi
          if [ -z "$v" ]; then echo "::error::could not determine the Immich version"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "key=immich-canary-$v-$SHA" >> "$GITHUB_OUTPUT"
          echo "Immich $v against ${SHA:0:7}"

      - name: Already tested this pair?
        id: seen
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .canary-tested
          key: ${{ steps.ver.outputs.key }}
          lookup-only: true

  selftest:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write # open or update the tracking issue on a scheduled failure
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install the runtime the worker uses
        run: brew install node@22 vips libpq

      - name: Self-test
        id: selftest
        env:
          HOME: ${{ runner.temp }}/home
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -o pipefail
          mkdir -p "$HOME"
          python3 -m immich_accelerator selftest --immich-version "$VERSION" 2>&1 | tee "$RUNNER_TEMP/selftest.log"

      - name: Open or update the tracking issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.decide.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Immich ${VERSION} fails the accelerator self-test"
          log="$(tail -n 40 "$RUNNER_TEMP/selftest.log" 2>/dev/null || echo 'no log')"
          body="$(printf 'The scheduled canary ran the self-test against Immich %s and it failed.\n\n~~~~\n%s\n~~~~\n\nRun: %s\n' "$VERSION" "$log" "$RUN_URL")"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

  # Pass or fail, this pair has now been tested: a failure is reported once and
  # not re-run every six hours until Immich or main changes. Saved from the
  # same OS that looks it up, so the cache entry always matches.
  remember:
    needs: [decide, selftest]
    if: always() && github.event_name == 'schedule' && (needs.selftest.result == 'success' || needs.selftest.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - run: date -u > .canary-tested
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .canary-tested
          key: ${{ needs.decide.outputs.key }}
