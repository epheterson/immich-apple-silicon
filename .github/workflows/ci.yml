name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m py_compile immich_accelerator/__init__.py
      - name: Run pytest (fast)
        run: |
          pip install pytest
          pytest -v -m "not slow"

  fresh-install-macos:
    # Runs on a clean macOS Apple Silicon runner — no global pip
    # packages, no leftover venvs. Catches the "works on my machine"
    # class of bug (issue #17: dashboard ModuleNotFoundError) before
    # it reaches users. The slow marker enables the venv+pip
    # integration test that builds a pristine fastapi+uvicorn env.
    #
    # EMERGENCY OVERRIDE: if macos-14 runners become flaky and this
    # blocks a release, trigger `update-homebrew.yml` manually via
    # `gh workflow run update-homebrew.yml -f tag=vX.Y.Z` — that
    # workflow bypasses CI entirely.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install pytest only (simulate fresh Mac)
        run: pip install pytest
      - name: Run fast fresh-install regression checks
        run: pytest -v tests/test_fresh_install.py -m "not slow"
      - name: Run slow integration test (real venv + pip install)
        # Separate step so a failure here is still visible as
        # "slow step failed" rather than masking the fast ones.
        run: pytest -v tests/test_fresh_install.py -m slow

  fresh-install-e2e:
    # Full E2E on macOS: install Docker, generate compose, start
    # Immich stack, run setup, start native worker + ML, validate.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install Docker via colima
        run: |
          brew install colima docker docker-compose
          colima start --cpu 2 --memory 4
          docker info
      - name: Install test dependencies
        run: pip install pytest
      - name: Install node@22 + vips + libpq
        run: |
          brew install node@22 vips libpq
          echo "/opt/homebrew/opt/node@22/bin" >> $GITHUB_PATH
      - name: Generate compose from template
        run: |
          python3 -c "
          import sys, os, secrets
          from pathlib import Path
          sys.path.insert(0, '.')
          from immich_accelerator.__main__ import _COMPOSE_TEMPLATE
          test_dir = Path('/tmp/fresh-install-ci')
          test_dir.mkdir(parents=True, exist_ok=True)
          photos = '/tmp/test-photos'
          os.makedirs(photos, exist_ok=True)
          data = str(test_dir / 'data')
          os.makedirs(data, exist_ok=True)
          compose = _COMPOSE_TEMPLATE.replace('{photos_mount}', f'{photos}:{photos}:ro')
          (test_dir / 'docker-compose.yml').write_text(compose)
          pw = secrets.token_urlsafe(24)
          env = f'UPLOAD_LOCATION={data}\nDB_PASSWORD={pw}\nDB_HOSTNAME=immich_postgres\nDB_USERNAME=postgres\nDB_DATABASE_NAME=immich\nREDIS_HOSTNAME=immich_redis\n'
          (test_dir / '.env').write_text(env)
          print('Compose generated')
          "
      - name: Start Immich Docker stack
        run: |
          cd /tmp/fresh-install-ci
          docker compose up -d
          echo "Waiting for API..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:2283/api/server/ping 2>/dev/null | grep -q pong; then
              echo "API up after ${i}x3s"
              break
            fi
            sleep 3
          done
          curl -sf http://localhost:2283/api/server/ping | grep -q pong || { echo "API never came up"; docker logs immich_server; exit 1; }
      - name: Verify detection
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          from immich_accelerator.__main__ import detect_immich
          immich = detect_immich('docker')
          assert immich['version'], 'no version'
          assert immich['workers_include'] == 'api'
          assert immich.get('media_location'), 'no media_location'
          print(f'Detected: v{immich[\"version\"]}')
          "
      - name: Extract server + install Sharp
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          from immich_accelerator.__main__ import detect_immich, extract_immich_server
          immich = detect_immich('docker')
          server_dir = extract_immich_server('docker', immich['container'], immich['version'])
          print(f'Server extracted: {server_dir}')
          "
      - name: Verify Sharp loads
        run: |
          node -e "const s = require('sharp'); console.log('Sharp OK:', s.versions.vips, s.versions.sharp)" \
            --require ~/.immich-accelerator/server/*/node_modules/.pnpm/sharp@*/node_modules/sharp 2>/dev/null || \
          python3 -c "
          import sys, subprocess
          sys.path.insert(0, '.')
          from immich_accelerator.__main__ import find_node, _verify_sharp_loads
          from pathlib import Path
          import glob
          server_dirs = glob.glob(str(Path.home() / '.immich-accelerator/server/*'))
          if server_dirs:
              node = find_node()
              ok, err = _verify_sharp_loads(server_dirs[0], node)
              print(f'Sharp loads: {ok}')
              if not ok: print(f'Error: {err[:200]}')
              assert ok, 'Sharp failed to load'
          "
      - name: Run unit tests
        run: pytest -v tests/test_fresh_install.py -m "not slow"
      - name: Tear down
        if: always()
        run: cd /tmp/fresh-install-ci && docker compose down -v 2>/dev/null || true

  auto-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, fresh-install-macos, fresh-install-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for version bump and tag
        id: tag
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists — skipping"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${VERSION} — creating tag"
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create draft release with changelog
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG_NAME#v}"
          # Find the previous release tag to capture all changelog sections since then
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          PREV_VERSION="${PREV_TAG#v}"
          if [ -n "$PREV_VERSION" ]; then
            # Extract all changelog sections from current version down to previous release
            NOTES=$(awk "/^## ${PREV_VERSION}[[:space:]]/{exit} /^## ${VERSION}[[:space:]]/{found=1; next} found{print}" CHANGELOG.md)
          else
            # First release — grab everything after the first ## heading
            NOTES=$(awk "/^## ${VERSION}[[:space:]]/{found=1; next} found{print}" CHANGELOG.md)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG_NAME}"
          fi
          cat > /tmp/release-notes.md << ENDNOTES
          ${NOTES}

          ### Upgrade
          \`\`\`bash
          brew upgrade immich-accelerator
          immich-accelerator setup   # if first time or new features require it
          \`\`\`
          ENDNOTES
          sed -i 's/^          //' /tmp/release-notes.md
          gh release create "${TAG_NAME}" \
            --latest \
            --title "Immich Accelerator ${TAG_NAME}" \
            --notes-file /tmp/release-notes.md
      - name: Trigger Homebrew formula update
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          gh workflow run update-homebrew.yml -f tag="$TAG_NAME"
