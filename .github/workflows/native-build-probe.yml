name: native-build-probe
# Throwaway: does a GitHub macOS runner have what mlx-swift needs to build the
# native bundle (Metal toolchain + metallib)? Delete once the answer is known.
on:
  workflow_dispatch:
  push:
    branches: [feat/native-ml-service]
    paths: ['.github/workflows/native-build-probe.yml', 'native-ml/**']

jobs:
  probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain inventory
        run: |
          sw_vers
          xcodebuild -version
          echo "=== metal compiler? ==="
          xcrun --find metal 2>&1 || echo "NO metal compiler"
          xcrun --find metallib 2>&1 || echo "NO metallib tool"
          swift --version

      - name: onnxruntime
        run: brew install onnxruntime

      - name: metallib from pip mlx (bundle fallback source)
        id: metallib
        run: |
          pip3 install --break-system-packages mlx 2>&1 | tail -1 || pip3 install mlx 2>&1 | tail -1
          ML=$(find "$(python3 -c 'import mlx,os;print(os.path.dirname(mlx.__file__))')" -name mlx.metallib 2>/dev/null | head -1)
          echo "pip metallib: ${ML:-NONE}"
          echo "path=$ML" >> "$GITHUB_OUTPUT"

      - name: swift build native-ml (the real question)
        run: |
          cd native-ml
          swift build -c release 2>&1 | tail -40
          echo "BUILD_EXIT=${PIPESTATUS[0]}"
          find .build -name "*.metallib" 2>/dev/null | head || echo "no metallib emitted by swift build"
          ls -la .build/release/immich-ml-native 2>/dev/null && echo "BINARY OK" || echo "NO BINARY"

      - name: package bundle
        if: success()
        env:
          MLX_METALLIB: ${{ steps.metallib.outputs.path }}
        run: |
          cd native-ml
          bash scripts/build_bundle.sh /tmp/bundle 2>&1 | tail -8 || echo "bundle build failed"
          otool -L /tmp/bundle/immich-ml-native 2>/dev/null | grep -iE "onnxruntime|@loader" || true
          ls -la /tmp/bundle 2>/dev/null && echo "BUNDLE OK" || echo "NO BUNDLE"
