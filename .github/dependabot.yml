# Weekly version updates, grouped so a quiet week is one pull request per ecosystem.
# Security updates are separate: they come as soon as an advisory lands, whatever the schedule
# (Settings > Code security > Dependabot security updates).
# There is no Python requirements file in the tree (the ML submodule carries its own pins).
version: 2

updates:
  # Every action is pinned to a commit; this keeps the pins and their version comments current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]

  # The native ML engine and the menu-bar app. mlx-swift is held to the validated 0.31.x by
  # Package.resolved and the metallib pin in the workflows, so a bump there is a person's call.
  - package-ecosystem: swift
    directories:
      - /native-ml
      - /menubar
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      swift-minor:
        update-types: [minor, patch]
    ignore:
      - dependency-name: mlx-swift
        update-types: [version-update:semver-major, version-update:semver-minor]

  # The reference compose file's images (Immich server, Redis, Postgres/pgvecto-rs).
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    ignore:
      # Immich is tracked at :release on purpose; Postgres needs a dump and restore to move.
      - dependency-name: tensorchord/pgvecto-rs
